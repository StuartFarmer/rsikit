[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rsikit"
version = "0.1.0"
description = "Composable API-only evolutionary search, prompt improvement, and reflection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["slick-ai>=0.3,<0.4", "pydantic>=2,<3"]

[project.optional-dependencies]
packing = ["openai>=2,<3", "matplotlib>=3.8,<4", "pillow>=10"]
dev = ["ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["rsikit"]

[tool.hatch.build.targets.sdist]
include = ["rsikit/", "docs/", "outputs/", "README.md", "pyproject.toml", "ruff.toml", ".gitignore"]
