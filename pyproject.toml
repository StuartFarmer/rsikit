[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rsikit"
version = "0.0.1"
description = "Class-based policies and isolated Gymnasium evaluation for API-only agent research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.3,<2",
    "numpy>=1.24,<3",
    "slick-ai>=0.3,<0.4",
    "pydantic>=2,<3",
    "sqlmodel>=0.0.24,<0.1",
    "cloudpickle>=3.1,<4",
    "rich>=13,<16",
    "PyYAML>=6,<7",
]

[project.scripts]
rsikit = "research.cli:main"

[project.urls]
Repository = "https://github.com/StuartFarmer/rsikit"
Issues = "https://github.com/StuartFarmer/rsikit/issues"

[project.optional-dependencies]
dev = ["ruff>=0.4"]
openai = ["slick-ai[openai]>=0.3,<0.4"]
openrouter = ["slick-ai[openai]>=0.3,<0.4"]
box2d = ["box2d-py==2.3.8", "gymnasium[classic-control]>=1.3,<2"]
video = ["gymnasium[classic-control]>=1.3,<2", "moviepy>=2,<3", "pillow>=11,<13"]
ocean = ["torch>=2.9,<3", "gym==0.23.1", "pettingzoo>=1.24,<2", "setuptools>=70", "wheel", "Cython>=3"]

[tool.uv.extra-build-dependencies]
box2d-py = ["swig>=4,<5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["rsikit", "research"]

[tool.hatch.build.targets.sdist]
include = ["Dockerfile", ".dockerignore", "scripts/", "data/", "uv.lock", "rsikit/", "research/", "examples/", "experiments/", "tests/", "docs/", "README.md", "pyproject.toml", "ruff.toml", ".gitignore"]
