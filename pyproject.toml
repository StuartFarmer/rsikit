[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rsikit"
version = "0.2.0"
description = "Class-based policies and isolated Gymnasium evaluation for API-only agent research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.3,<2",
    "numpy>=1.24,<3",
    "slick-ai>=0.3,<0.4",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]
openai = ["slick-ai[openai]>=0.3,<0.4"]
openrouter = ["slick-ai[openai]>=0.3,<0.4"]

[tool.hatch.build.targets.wheel]
packages = ["rsikit"]

[tool.hatch.build.targets.sdist]
include = ["rsikit/", "examples/", "tests/", "docs/", "README.md", "pyproject.toml", "ruff.toml", ".gitignore"]
