name: Publish documentation

# Run manually on the reviewed release tag. Building a PR never publishes it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.9.26
      - run: uv sync --locked --extra docs
      - run: cargo install mdbook --version 0.5.2 --locked
      - run: mdbook build
        env:
          MDBOOK_OUTPUT__HTML__EDIT_URL_TEMPLATE: https://github.com/StuartFarmer/rsikit/blob/${{ github.sha }}/{path}
      - run: python scripts/check_docs.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
