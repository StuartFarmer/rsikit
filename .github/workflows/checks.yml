name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Offline core and featured examples
        run: >-
          python -m unittest
          tests.test_policy_contract tests.test_validation tests.test_evaluation
          tests.test_evaluator tests.test_episode_storage tests.test_execution
          tests.test_jobs tests.test_huey_execution tests.test_run tests.test_run_evaluation
          tests.test_optimizer_contract tests.test_port_optimizer_contract
          tests.test_package_boundaries tests.test_cli tests.test_release_examples -v
  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.9.26 build twine
      - run: uv sync --locked --extra dev --extra docs
      - run: uv run --no-sync ruff check rsikit research examples tests scripts
      - run: uv run --no-sync ruff format --check rsikit research examples tests scripts
      - run: cargo install mdbook --version 0.5.2 --locked
      - run: mdbook build
      - run: python scripts/check_docs.py
      - run: python -m build
      - run: python scripts/check_distribution.py dist
      - run: python -m twine check dist/*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv /tmp/rsikit-wheel
          /tmp/rsikit-wheel/bin/python -m pip install dist/*.whl
          cp examples/existing_system.py examples/custom_system.py /tmp/
          cd /tmp
          /tmp/rsikit-wheel/bin/rsikit --help
          /tmp/rsikit-wheel/bin/python existing_system.py
          /tmp/rsikit-wheel/bin/python custom_system.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/
            book/
